<!doctype html>
<html>
<head>

  <title>Eddy</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; }
    label { display: flex; gap: 8px; align-items: flex-start; }
    p { color: #666; margin: 8px 0 0 24px; }

<body>
  <label><input type="checkbox" id="takeOver"> Send the browser's downloads to Eddy</label>

    Links, pictures and videos can always be sent from the right-click menu.</p>
  <p>In Eddy: Settings → General → Browser extension, once, so the browser can reach it.</p>
  <script src="options.js"></script>
</body>
