[package]
name = "eddy"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
# aria2_rust, patched (see patches/aria2_rust), is a workspace of its own, as
# is the desktop app's webview helper (webview/: a program of its own, so
# Eddy doesn't need WebKitGTK or WebView2 to start).
exclude = ["patches/aria2_rust", "webview"]

# Android/IOS build target
[lib]
name = "eddy"
# cdylib: Android's libeddy.so; rlib: the desktop binary below. An iOS build
# would need a static library: `cargo rustc --lib --crate-type staticlib`.
crate-type = ["cdylib", "rlib"]

# Linux/Win/Mac build target
# Named apart from the library (`eddy`, Android's libeddy.so): on Windows the
# two would write the same eddy.pdb. Releases rename it anyway.
[[bin]]
name = "eddy-desktop"
path = "src/main.rs"

[dependencies]
# MEGA: its files are AES-128-CTR encrypted, names AES-CBC, keys AES-ECB
# (versions already in the tree). 0.9 uses ARMv8's AES instructions when the
# CPU has them; 0.8 only with a --cfg flag, and ran 20x slower without.
aes = "0.9"
aria2-core = { git = "https://github.com/balovess/aria2_rust/", package = "aria2-core", features = ["bittorrent", "metalink", "sftp"] }
# Torrent file parsing (names and sizes for picked .torrent files).
aria2-protocol = { git = "https://github.com/balovess/aria2_rust/", package = "aria2-protocol" }
base64 = "0.21"
ctr = "0.10"
dirs = "5.0"
# The UI, compiled from ui/*.slint (re-exported in src/lib.rs).
eddy-ui = { path = "ui" }
# Walking scraper's parsed tree (its node type).
ego-tree = "0.10"
linkify = "0.11"
log = "0.4"
percent-encoding = "2"
rand = "0.8"
regex = "1"
# Link checks. Same reqwest build as aria2-core.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Novels: reading sites' HTML, and packing the EPUB (also unpacks the
# desktop tools).
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.18.1" }
sys-locale = "0.3"
tokio = { version = "1.30", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
# aria2-core reports through tracing; its warnings and errors go to
# logs/aria2.log (see logs.rs).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Unpacking yt-dlp, ffmpeg and Deno (Settings → Downloads); pure Rust.
lzma-rs = "0.3"
# Finished / failed download notifications.
notify-rust = "4"
# The window handle, for Windows' taskbar progress.
raw-window-handle = "0.6"
rfd = "0.14"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
system-theme = { version = "0.3", default-features = false }
tar = "0.4"
webbrowser = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
android_logger = "0.14"
jni = "0.22"
ndk-context = "0.1"
# HTTPS certificate checks through Android's own verifier (used by reqwest in
# aria2-core and the link checks); set up in platform::init. Its Java half comes from Gradle.
rustls-platform-verifier = "0.7"
serde_json = "1.0"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }

# Taskbar progress: the Unity launcher entry signal (KDE, Dash to Dock),
# over the D-Bus library Slint already uses.
# iOS: Slint's winit backend, drawn with Skia on Metal (Slint's iOS guide).
[target.'cfg(target_os = "ios")'.dependencies]
# The window's handle: the browser for bot checks goes in it (platform/ios_webview.rs).
slint = { version = "1.18.1", features = ["renderer-skia", "raw-window-handle-06"] }
# The desktop helper's jobs for that browser, run in-process (webview/src/lib.rs).
eddy-webview = { path = "webview", default-features = false }
# UIKit (opening links and files, the share sheet) and BackgroundTasks
# (downloads kept going in the background, platform/ios_background.rs), with
# the objc2 versions Slint's winit backend already uses.
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-background-tasks = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "dispatch2", "BGTask", "BGTaskRequest", "BGTaskScheduler"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSProgress", "NSSet", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "objc2-core-foundation",
    "UIAction",
    "UIActivity",
    "UIActivityViewController",
    "UIApplication",
    "UIButton",
    "UIColor",
    "UIControl",
    "UIGeometry",
    "UIImage",
    "UIInterface",
    "UIMenuElement",
    "UIPopoverPresentationController",
    "UIPresentationController",
    "UIResponder",
    "UIScene",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Taskbar progress: Windows' ITaskbarList3 (the version Slint already uses).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

# Process groups for the programs Eddy starts (children.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# iOS: compiles SwiftFFmpeg-iOS's C wrapper, linked with its FFmpeg (build.rs).
[build-dependencies]
cc = "1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
lto = "fat"
opt-level = "z"
strip = "symbols"
codegen-units = 1
panic = "abort"

# Slint 1.18.1's Android backend with the upstream fix that releases the GPU
# surface when the window goes, running on GameActivity (see
# patches/i-slint-backend-game-activity), and touches the system takes over
# for a gesture (back swipe, home, the notification shade) no longer clicking
# what was under them. Drop once a Slint release includes these.
[patch.crates-io]
i-slint-backend-android-activity = { path = "patches/i-slint-backend-game-activity" }

# aria2_rust with resuming fixed (see patches/aria2_rust/EDDY.md).
[patch."https://github.com/balovess/aria2_rust/"]
aria2-core = { path = "patches/aria2_rust/aria2-core" }
aria2-protocol = { path = "patches/aria2_rust/aria2-protocol" }
