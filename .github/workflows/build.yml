name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # SLINT_STYLE is each job's own: fluent on the desktops, material on
  # Android. Never Qt, even where it's installed: Slint would link it,
  # making Qt something the app needs to start.
  SLINT_NO_QT: "1"
  CARGO_INCREMENTAL: 0
  # Compiler output cached in GitHub's cache (see "Set up sccache").
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # Warnings are errors in Eddy's crates and its patched copies (registry
  # crates are exempt): a new one fails the PR instead of piling up.
  RUSTFLAGS: "-C debuginfo=0 -D warnings"

jobs:
  build-windows-x86_64:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    env:
      SLINT_STYLE: fluent
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Dependencies only (Eddy's own crates are left out), restored from
      # main's cache and saved only on main, so PRs don't fill the store.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64
          workspaces: |
            .
            webview
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each crate's compiled output, found again by its inputs (unlike
      # Cargo's own reuse, this survives a fresh checkout): a PR that leaves
      # the UI alone doesn't build eddy-ui again.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Just the program (--bin): a plain build also makes the library's
      # cdylib, which the desktop doesn't use.
      - name: Build (release)
        run: |
          cargo build --release --bin eddy-desktop --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc --manifest-path webview/Cargo.toml

      - name: Rename Binary
        run: |
          Move-Item -Path "target\x86_64-pc-windows-msvc\release\eddy-desktop.exe" -Destination "target\x86_64-pc-windows-msvc\release\eddy-windows-x86_64.exe" -Force
          Move-Item -Path "webview\target\x86_64-pc-windows-msvc\release\eddy-webview.exe" -Destination "target\x86_64-pc-windows-msvc\release\eddy-webview-windows-x86_64.exe" -Force


      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eddy-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/eddy-windows-x86_64.exe
            target/x86_64-pc-windows-msvc/release/eddy-webview-windows-x86_64.exe
          retention-days: 1

  build-windows-arm64:
    name: Build (Windows arm64)
    runs-on: windows-11-arm
    env:
      SLINT_STYLE: fluent
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Dependencies only (Eddy's own crates are left out), restored from
      # main's cache and saved only on main, so PRs don't fill the store.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-arm64
          workspaces: |
            .
            webview
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each crate's compiled output, found again by its inputs (unlike
      # Cargo's own reuse, this survives a fresh checkout): a PR that leaves
      # the UI alone doesn't build eddy-ui again.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build (release)
        run: |
          cargo build --release --bin eddy-desktop
          cargo build --release --manifest-path webview/Cargo.toml

      - name: Rename Binary
        run: |
          Move-Item -Path "target\release\eddy-desktop.exe" -Destination "target\release\eddy-windows-arm64.exe" -Force
          Move-Item -Path "webview\target\release\eddy-webview.exe" -Destination "target\release\eddy-webview-windows-arm64.exe" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eddy-windows-arm64
          path: |
            target/release/eddy-windows-arm64.exe
            target/release/eddy-webview-windows-arm64.exe
          retention-days: 1

  build-linux-x86_64:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    env:
      SLINT_STYLE: fluent
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          # Slint (fontconfig, xcb, xkbcommon), rfd's GTK file dialogs, system-theme (D-Bus),
          # and WebKitGTK for eddy-webview (only the helper links it).
          sudo apt-get install -y libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev libwebkit2gtk-4.1-dev

      # Dependencies only (Eddy's own crates are left out), restored from
      # main's cache and saved only on main, so PRs don't fill the store.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          workspaces: |
            .
            webview
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each crate's compiled output, found again by its inputs (unlike
      # Cargo's own reuse, this survives a fresh checkout): a PR that leaves
      # the UI alone doesn't build eddy-ui again.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build (release)
        run: |
          cargo build --release --bin eddy-desktop
          cargo build --release --manifest-path webview/Cargo.toml

      - name: Tests
        run: cargo test --release --lib

      - name: Rename Binary
        run: |
          mv -f target/release/eddy-desktop target/release/eddy-linux-x86_64
          mv -f webview/target/release/eddy-webview target/release/eddy-webview-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eddy-linux-x86_64
          path: |
            target/release/eddy-linux-x86_64
            target/release/eddy-webview-linux-x86_64
          retention-days: 1

  build-linux-arm64:
    name: Build (Linux arm64)
    runs-on: ubuntu-24.04-arm
    env:
      SLINT_STYLE: fluent
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          # Slint (fontconfig, xcb, xkbcommon), rfd's GTK file dialogs, system-theme (D-Bus),
          # and WebKitGTK for eddy-webview (only the helper links it).
          sudo apt-get install -y libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev libwebkit2gtk-4.1-dev

      # Dependencies only (Eddy's own crates are left out), restored from
      # main's cache and saved only on main, so PRs don't fill the store.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-arm64
          workspaces: |
            .
            webview
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each crate's compiled output, found again by its inputs (unlike
      # Cargo's own reuse, this survives a fresh checkout): a PR that leaves
      # the UI alone doesn't build eddy-ui again.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build (release)
        run: |
          cargo build --release --bin eddy-desktop
          cargo build --release --manifest-path webview/Cargo.toml

      - name: Rename Binary
        run: |
          mv -f target/release/eddy-desktop target/release/eddy-linux-arm64
          mv -f webview/target/release/eddy-webview target/release/eddy-webview-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eddy-linux-arm64
          path: |
            target/release/eddy-linux-arm64
            target/release/eddy-webview-linux-arm64
          retention-days: 1

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    env:
      SLINT_STYLE: fluent
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Dependencies only (Eddy's own crates are left out), restored from
      # main's cache and saved only on main, so PRs don't fill the store.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}
          workspaces: |
            .
            webview
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each crate's compiled output, found again by its inputs (unlike
      # Cargo's own reuse, this survives a fresh checkout): a PR that leaves
      # the UI alone doesn't build eddy-ui again.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build (release)
        run: |
          cargo build --release --bin eddy-desktop
          cargo build --release --manifest-path webview/Cargo.toml

      # Eddy.app: Eddy with its webview helper beside it (macOS's own WebKit,
      # nothing to install), zipped.
      - name: Bundle
        run: |
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | awk -F '"' '{print $2}')
          APP=Eddy.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp target/release/eddy-desktop $APP/Contents/MacOS/eddy
          cp webview/target/release/eddy-webview $APP/Contents/MacOS/
          # The icon, from the Windows one (sips reads .ico); none if that fails.
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -s format png -z $size $size ui/icons/logo.ico --out icon.iconset/icon_${size}x${size}.png > /dev/null || true
          done
          for size in 16 32 128 256; do
            double=$((size * 2))
            if [ -f icon.iconset/icon_${double}x${double}.png ]; then
              cp icon.iconset/icon_${double}x${double}.png icon.iconset/icon_${size}x${size}@2x.png
            fi
          done
          rm -f icon.iconset/icon_64x64.png
          iconutil -c icns icon.iconset -o $APP/Contents/Resources/eddy.icns || echo "no icon"
          cat > $APP/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Eddy</string>
            <key>CFBundleDisplayName</key><string>Eddy</string>
            <key>CFBundleIdentifier</key><string>dev.pah.eddy</string>
            <key>CFBundleExecutable</key><string>eddy</string>
            <key>CFBundleIconFile</key><string>eddy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Not signed with a developer ID: an ad-hoc signature, which Apple
          # Silicon needs to run it at all.
          codesign --force --deep --sign - $APP
          ditto -c -k --keepParent $APP eddy-macos-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eddy-macos-${{ matrix.arch }}
          path: eddy-macos-${{ matrix.arch }}.zip
          retention-days: 1

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    env:
      SLINT_STYLE: material
      # Cargo's output where the cache below finds it (Xcode's own folder
      # otherwise; see platforms/ios/build_for_ios_with_cargo.bash).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # FFmpeg linked into the app (build.rs; fetched below).
      EDDY_FFMPEG_IOS: ${{ github.workspace }}/platforms/ios/SwiftFFmpeg-iOS
      # QuickJS-ng's source, the JavaScript fallback (build.rs; fetched below).
      EDDY_QUICKJS_IOS: ${{ github.workspace }}/platforms/ios/quickjs
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install XcodeGen
        run: brew install xcodegen

      # The app's own Python (yt-dlp and gallery-dl run in it: iOS starts no
      # processes), and those packages: pure-Python wheels only, as macOS
      # binary wheels wouldn't load on iOS. yt-dlp-ejs has the YouTube
      # challenge solver for QuickJS (yt-dlp's own copy is Deno's and Bun's).
      - name: Python and its packages
        run: |
          cd platforms/ios
          curl -sSL https://github.com/beeware/Python-Apple-support/releases/download/3.14-b14/Python-3.14-iOS-support.b14.tar.gz | tar -xz
          python3 -m pip install --quiet --target app_packages --no-deps \
            --only-binary=:all: --platform any --implementation py --abi none --python-version 3.14 \
            yt-dlp yt-dlp-ejs gallery-dl requests urllib3 idna charset-normalizer certifi
          ls app_packages

      # ffmpeg and ffprobe as functions (tfourj/SwiftFFmpeg-iOS, GPL-3.0):
      # yt-dlp merges and converts through them.
      - name: FFmpeg
        run: |
          cd platforms/ios
          curl -sSL -o ffmpeg.zip https://github.com/tfourj/SwiftFFmpeg-iOS/releases/download/1.2.0/SwiftFFmpeg-iOS.zip
          unzip -q ffmpeg.zip && rm ffmpeg.zip
          ls SwiftFFmpeg-iOS SwiftFFmpeg-iOS/FFmpeg.xcframework

      # QuickJS-ng (MIT): runs yt-dlp's YouTube challenge solver when iOS's
      # JavaScriptCore can't.
      - name: QuickJS-ng
        run: |
          mkdir -p platforms/ios/quickjs
          curl -sSL https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.18.0.tar.gz | tar -xz -C platforms/ios/quickjs --strip-components=1
          ls platforms/ios/quickjs/quickjs.c

      # Eddy.app from the Xcode project XcodeGen makes (cargo builds the
      # executable), not signed.
      - name: Build (release)
        run: |
          cd platforms/ios
          xcodegen
          xcodebuild -project Eddy.xcodeproj -scheme Eddy -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      # An unsigned .ipa: AltStore, SideStore or Sideloadly sign it with the
      # installer's Apple ID.
      - name: Package
        run: |
          mkdir Payload
          cp -R platforms/ios/build/Build/Products/Release-iphoneos/Eddy.app Payload/
          zip -qry eddy-ios-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eddy-ios-unsigned
          path: eddy-ios-unsigned.ipa
          retention-days: 1

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    env:
      SLINT_STYLE: material
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
    
      - name: Install Rust stable + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      # Dependencies only (Eddy's own crates are left out), restored from
      # main's cache and saved only on main, so PRs don't fill the store.
      # Before cargo-ndk's install: it keeps ~/.cargo/bin too.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          workspaces: |
            .
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each crate's compiled output, found again by its inputs (unlike
      # Cargo's own reuse, this survives a fresh checkout): a PR that leaves
      # the UI alone doesn't build eddy-ui again.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install dependencies (Linux host)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      # Its default package list still includes "tools", which the SDK no
      # longer has. android-36 for the Rust library (as built locally), 35
      # for Gradle's compileSdk.
      - name: Set up SDK and Install Android Platform
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-35"

      - name: Build Rust library (arm64-v8a release)
        env:
          ANDROID_PLATFORM: android-36
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
          # The Slint backend's build script uses it to build its Java helper
          # (it says when it isn't set, and takes 35.0.0).
          ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
        run: cargo ndk -t arm64-v8a -P 26 build --lib --release

      - name: Build Rust library (armeabi-v7a release)
        env:
          ANDROID_PLATFORM: android-36
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
          # The Slint backend's build script uses it to build its Java helper
          # (it says when it isn't set, and takes 35.0.0).
          ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
          FORCE_SKIA_BUILD: 1 
        run: cargo ndk -t armeabi-v7a -P 26 build --lib --release

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > platforms/android/app/release.keystore

      - name: Build APKs with Gradle
        env:
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Clean up Keystore
        if: always()
        run: rm -f platforms/android/app/release.keystore

      - name: Rename APKs
        run: |
          cd platforms/android/app/build/outputs/apk/release
          find . -name "*arm64-v8a*.apk" -exec mv {} eddy-android-arm64.apk \;
          find . -name "*armeabi-v7a*.apk" -exec mv {} eddy-android-armv7.apk \;
          find . -name "*universal*.apk" -exec mv {} eddy-android-universal.apk \;
          if [ -f app-release.apk ]; then
            mv app-release.apk eddy-android-universal.apk
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: eddy-android
          path: platforms/android/app/build/outputs/apk/release/*.apk
          retention-days: 1

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-x86_64, build-windows-arm64, build-linux-x86_64, build-linux-arm64, build-macos, build-ios, build-android]
    if: github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write 
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract Version and Generate Checksums
        id: prep_release
        run: |
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | awk -F '"' '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          cd release-artifacts

          WIN_X64_SHA=$(sha256sum eddy-windows-x86_64.exe | awk '{print $1}')
          WIN_ARM_SHA=$(sha256sum eddy-windows-arm64.exe | awk '{print $1}')
          LINUX_X64_SHA=$(sha256sum eddy-linux-x86_64 | awk '{print $1}')
          LINUX_ARM_SHA=$(sha256sum eddy-linux-arm64 | awk '{print $1}')
          MAC_ARM_SHA=$(sha256sum eddy-macos-arm64.zip | awk '{print $1}')
          MAC_X64_SHA=$(sha256sum eddy-macos-x86_64.zip | awk '{print $1}')
          IOS_SHA=$(sha256sum eddy-ios-unsigned.ipa | awk '{print $1}')
          
          APK_ARM64_SHA=$(sha256sum eddy-android-arm64.apk | awk '{print $1}')
          APK_ARMV7_SHA=$(sha256sum eddy-android-armv7.apk | awk '{print $1}')
          APK_UNIV_SHA=$(sha256sum eddy-android-universal.apk | awk '{print $1}')

          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "Eddy v$VERSION" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### Checksums" >> $GITHUB_ENV
          echo "| Variant | SHA-256 |" >> $GITHUB_ENV
          echo "| ------- | ------- |" >> $GITHUB_ENV
          echo "| Windows x86_64 | $WIN_X64_SHA |" >> $GITHUB_ENV
          echo "| Windows arm64 | $WIN_ARM_SHA |" >> $GITHUB_ENV
          echo "| Linux x86_64 | $LINUX_X64_SHA |" >> $GITHUB_ENV
          echo "| Linux arm64 | $LINUX_ARM_SHA |" >> $GITHUB_ENV
          echo "| macOS arm64 | $MAC_ARM_SHA |" >> $GITHUB_ENV
          echo "| macOS x86_64 | $MAC_X64_SHA |" >> $GITHUB_ENV
          echo "| iOS (unsigned) | $IOS_SHA |" >> $GITHUB_ENV
          echo "| Android arm64-v8a | $APK_ARM64_SHA |" >> $GITHUB_ENV
          echo "| Android armv7 | $APK_ARMV7_SHA |" >> $GITHUB_ENV
          echo "| Android Universal | $APK_UNIV_SHA |" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          body: ${{ env.RELEASE_BODY }}
          draft: true
          files: |
            release-artifacts/eddy-windows-x86_64.exe
            release-artifacts/eddy-windows-arm64.exe
            release-artifacts/eddy-linux-x86_64
            release-artifacts/eddy-linux-arm64
            release-artifacts/eddy-macos-*.zip
            release-artifacts/eddy-ios-unsigned.ipa
            release-artifacts/*.apk

      - name: Delete Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: eddy-*
