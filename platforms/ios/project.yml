# The iOS app's Xcode project: `xcodegen` here makes Eddy.xcodeproj. Cargo
# builds the executable (eddy-ios) through build_for_ios_with_cargo.bash,
# as Slint's iOS guide does.
name: Eddy
options:
  bundleIdPrefix: dev.pah
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Eddy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.pah.eddy
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.2.0"
      CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Eddy
        # Full refresh rate on ProMotion screens (iOS caps apps at 60 otherwise).
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          - ImageRespectSafeAreaInsets: false
        # Downloads go to Documents: shown in Files, under On My iPhone › Eddy.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Downloads keep going in the background: a continued-processing
        # task (iOS 26), one identifier per task asked for (see
        # src/platform/ios_background.rs).
        BGTaskSchedulerPermittedIdentifiers:
          - dev.pah.eddy.downloads.*
        UIBackgroundModes:
          - processing
        # UIKit's scene lifecycle (iOS 27 won't launch an app without it), with
        # the scene delegate Slint's winit backend provides.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
    # The app icon (its PNG rendered by CI from ui/icons/logo.svg).
    sources:
      - path: Assets.xcassets
    # Python (BeeWare's Python-Apple-support, fetched by CI into this
    # folder): embedded, not linked; Eddy loads it when yt-dlp first runs.
    dependencies:
      - framework: Python.xcframework
        embed: true
        link: false
    postCompileScripts:
      - script: |
          ./build_for_ios_with_cargo.bash eddy-ios
        outputFileLists:
          $TARGET_BUILD_DIR/$EXECUTABLE_PATH
      # Python's standard library and Eddy's packages (yt-dlp, gallery-dl)
      # into the app, their binary modules made frameworks (Python's iOS
      # guide). Unsigned builds sign those ad hoc; sideloading re-signs.
      - name: Process Python libraries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          rsync -a --delete "$PROJECT_DIR/app_packages/" "$CODESIGNING_FOLDER_PATH/app_packages/"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          install_python Python.xcframework app_packages
